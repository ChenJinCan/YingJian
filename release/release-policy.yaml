schema_version: 2

app:
  id: yingjian

packaging:
  mode: local_only

identity:
  version_rule: reuse_testing_else_patch_public
  build_rule: global_latest_plus_one

baseline:
  source: authenticated_store_console
  max_age_minutes: 30

source:
  require_clean_worktree: true
  require_upstream_sync: true

platforms:
  ios:
    identifier: com.babycompany.yingjian
    release_ready: false
    blocker: Local tooling exists, but frozen MVP acceptance evidence, production signing, a current authenticated store baseline, exact TestFlight group selection, and final archive verification remain incomplete.
    env_file: .env.testflight
    env_example: .env.testflight.example
    required_tools:
      - flutter
      - ruby
      - xcodebuild
      - xcrun
      - codesign
      - unzip
      - plutil
    required_env:
      - ASC_KEY_ID
      - ASC_ISSUER_ID
      - ASC_KEY_PATH
    build_required_env: []
    upload_required_env:
      - ASC_KEY_ID
      - ASC_ISSUER_ID
      - ASC_KEY_PATH
    forbidden_env:
      - VERSION
      - BUILD_NUMBER
      - RELEASE_PUBLIC_VERSION
      - RELEASE_REMOTE_LATEST_VERSION
      - RELEASE_REMOTE_LATEST_BUILD
      - RELEASE_BASELINE_VERIFIED_AT
      - RELEASE_SOURCE_COMMIT
  android:
    identifier: com.babycompany.yingjian
    release_ready: false
    blocker: Google Play policy drafts exist, but the default store listing, release signing, production assets, track setup, and final AAB verification are incomplete.
    env_file: .env.android
    env_example: .env.android.example
    required_tools:
      - flutter
      - ruby
      - keytool
    required_env:
      - ANDROID_SIGNING_PROPERTIES_FILE
    forbidden_env:
      - VERSION_NAME
      - VERSION_CODE
      - RELEASE_PUBLIC_VERSION
      - RELEASE_REMOTE_LATEST_VERSION
      - RELEASE_REMOTE_LATEST_BUILD
      - RELEASE_BASELINE_VERIFIED_AT
      - RELEASE_SOURCE_COMMIT
