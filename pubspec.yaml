name: yingjian
description: "Yingjian intelligent photo editor."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_analytics: ^12.0.1
  firebase_core: ^4.1.0
  firebase_crashlytics: ^5.0.1
  firebase_performance: ^0.11.4+5
  in_app_review: ^2.0.12
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  image_picker: ^1.2.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/legal/
    - assets/build/
